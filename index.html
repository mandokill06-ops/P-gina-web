<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>ZenHan Gaming Hub - Zona Privada</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- JSZip -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
    <!-- Firebase SDKs (Compat) -->
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
    <style>
        body {
            background: linear-gradient(135deg, #064e3b 0%, #022c22 50%, #065f46 100%);
            color: #ecfdf5;
            font-family: system-ui, -apple-system, sans-serif;
        }
        .gamer-card {
            background: rgba(6, 78, 59, 0.7);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(52, 211, 153, 0.3);
        }
    </style>
</head>
<body class="min-h-screen flex flex-col items-center justify-center p-4 relative overflow-x-hidden">

    <!-- ADORNOS DE VIDEOJUEGOS DE FONDO -->
    <div class="absolute -top-10 -left-10 text-emerald-500/10 text-9xl select-none pointer-events-none">🎮</div>
    <div class="absolute -bottom-10 -right-10 text-emerald-500/10 text-9xl select-none pointer-events-none">🕹️</div>

    <!-- CONTENEDOR PRINCIPAL -->
    <div id="app" class="w-full max-w-md gamer-card rounded-2xl shadow-2xl p-6 relative z-10">
        
        <!-- PANTALLA DE LOGIN -->
        <div id="login-screen">
            <div class="text-center mb-6">
                <span class="text-4xl animate-bounce inline-block">🕹️</span>
                <h1 class="text-2xl font-black mt-2 tracking-wide text-emerald-300">ZENHAN GAMING</h1>
                <p class="text-emerald-400/80 text-xs uppercase tracking-widest font-semibold">Plataforma Exclusiva HTML5</p>
            </div>
            
            <div class="space-y-4">
                <div>
                    <label class="block text-xs font-bold text-emerald-300 mb-1">USUARIO</label>
                    <input type="text" id="username" class="w-full bg-emerald-950/60 border border-emerald-700/50 rounded-xl px-4 py-3 text-white focus:outline-none focus:border-emerald-400 placeholder-emerald-700" placeholder="Ingresa tu usuario">
                </div>
                <div>
                    <label class="block text-xs font-bold text-emerald-300 mb-1">CONTRASEÑA</label>
                    <input type="password" id="password" class="w-full bg-emerald-950/60 border border-emerald-700/50 rounded-xl px-4 py-3 text-white focus:outline-none focus:border-emerald-400 placeholder-emerald-700" placeholder="••••••••">
                </div>
                <button type="button" id="login-btn" onclick="handleLogin()" class="w-full bg-emerald-500 hover:bg-emerald-400 text-slate-950 font-black py-3 rounded-xl transition duration-200 shadow-lg shadow-emerald-500/20 cursor-pointer">
                    INICIAR SESIÓN 🚀
                </button>
            </div>
            <p id="login-error" class="text-rose-400 text-xs text-center mt-3 font-semibold hidden"></p>
        </div>

        <!-- PANEL DE ADMINISTRADOR -->
        <div id="admin-panel" class="hidden space-y-6">
            <div class="flex justify-between items-center border-b border-emerald-800/60 pb-4">
                <div>
                    <h1 class="text-xl font-bold flex items-center gap-2 text-emerald-300">👑 Panel Admin</h1>
                    <p class="text-xs text-emerald-400/80">Control Maestro - ZenHan</p>
                </div>
                <button type="button" onclick="logout()" class="bg-rose-500/20 text-rose-300 hover:bg-rose-500/30 px-3 py-1.5 rounded-lg text-xs font-bold transition">Salir</button>
            </div>

            <!-- Subir Juego Local (.ZIP) -->
            <div class="bg-emerald-950/40 border border-emerald-800/40 p-4 rounded-xl space-y-3">
                <h2 class="text-sm font-bold text-emerald-300">Subir Juego Local (.ZIP)</h2>
                <div class="space-y-3">
                    <input type="text" id="game-name" placeholder="Nombre del Juego" class="w-full bg-emerald-950/60 border border-emerald-700/50 rounded-lg px-3 py-2 text-sm text-white placeholder-emerald-700">
                    <div>
                        <label class="block text-xs text-emerald-400 mb-1">Seleccionar .ZIP de tu dispositivo:</label>
                        <input type="file" id="game-file" accept=".zip" class="w-full bg-emerald-950/60 border border-emerald-700/50 rounded-lg px-3 py-2 text-xs text-emerald-200 file:mr-4 file:py-1 file:px-3 file:rounded-md file:border-0 file:text-xs file:font-semibold file:bg-emerald-500 file:text-slate-950 hover:file:bg-emerald-400">
                    </div>
                    <button type="button" id="upload-game-btn" onclick="uploadGame()" class="w-full bg-emerald-500 hover:bg-emerald-400 text-slate-950 text-sm font-bold py-2 rounded-lg transition shadow-md">
                        Subir y Publicar Juego
                    </button>
                </div>
            </div>

            <!-- Lista de Juegos Registrados -->
            <div class="space-y-2">
                <h3 class="text-xs font-bold text-emerald-400 uppercase tracking-wider">Juegos Registrados</h3>
                <div id="admin-games-list" class="space-y-2 max-h-40 overflow-y-auto pr-1"></div>
            </div>

            <!-- Crear Cuenta Invitado -->
            <div class="bg-emerald-950/40 border border-emerald-800/40 p-4 rounded-xl space-y-3">
                <h2 class="text-sm font-bold text-emerald-300">Crear Cuenta de Invitado</h2>
                <div class="space-y-3">
                    <input type="text" id="guest-user" placeholder="Usuario Invitado" class="w-full bg-emerald-950/60 border border-emerald-700/50 rounded-lg px-3 py-2 text-sm text-white placeholder-emerald-700">
                    <input type="password" id="guest-pass" placeholder="Contraseña de Invitado" class="w-full bg-emerald-950/60 border border-emerald-700/50 rounded-lg px-3 py-2 text-sm text-white placeholder-emerald-700">
                    <button type="button" onclick="createGuest()" class="w-full bg-emerald-600 hover:bg-emerald-500 text-white text-sm font-bold py-2 rounded-lg transition">Crear Cuenta</button>
                </div>
            </div>

            <!-- Lista de Usuarios Invitados -->
            <div class="space-y-2">
                <h3 class="text-xs font-bold text-emerald-400 uppercase tracking-wider">Usuarios Invitados</h3>
                <div id="admin-users-list" class="space-y-2 max-h-40 overflow-y-auto pr-1"></div>
            </div>
        </div>

        <!-- PANEL DE INVITADO / JUEGOS -->
        <div id="guest-panel" class="hidden space-y-4">
            <div class="flex justify-between items-center border-b border-emerald-800/60 pb-4">
                <div>
                    <h1 class="text-xl font-bold text-emerald-300">🎮 Zona de Juegos</h1>
                    <p id="guest-welcome" class="text-xs text-emerald-400/80"></p>
                </div>
                <button type="button" onclick="logout()" class="bg-rose-500/20 text-rose-300 hover:bg-rose-500/30 px-3 py-1.5 rounded-lg text-xs font-bold transition">Salir</button>
            </div>

            <div class="space-y-2">
                <h2 class="text-xs font-bold text-emerald-400 uppercase tracking-wider">Juegos Disponibles</h2>
                <div id="games-list" class="space-y-2 max-h-96 overflow-y-auto"></div>
            </div>
        </div>

    </div>

    <!-- REPRODUCTOR A PANTALLA COMPLETA TOTAL -->
    <div id="emulator-screen" class="hidden fixed inset-0 bg-black z-[9999] flex flex-col w-screen h-screen">
        <div class="bg-emerald-950/90 border-b border-emerald-800/50 p-2.5 flex justify-between items-center shrink-0">
            <span id="emulator-title" class="font-bold text-xs text-emerald-300 truncate max-w-[150px]">Cargando juego...</span>
            <div class="flex gap-2 items-center">
                <button type="button" onclick="toggleFullscreen()" class="bg-indigo-600 hover:bg-indigo-500 text-white px-2.5 py-1 rounded-lg text-xs font-bold">⛶ Fullscreen</button>
                <button type="button" id="download-zip-btn" class="bg-emerald-600 hover:bg-emerald-500 text-white px-2.5 py-1 rounded-lg text-xs font-bold hidden">📥 ZIP</button>
                <button type="button" onclick="closeEmulator()" class="bg-rose-600 hover:bg-rose-500 text-white px-2.5 py-1 rounded-lg text-xs font-bold">✕ Cerrar</button>
            </div>
        </div>
        <div id="emulator-content" class="flex-1 w-full h-full relative bg-black flex items-center justify-center overflow-hidden">
            <div id="emulator-loading" class="text-center z-10 p-4">
                <div class="inline-block animate-spin rounded-full h-8 w-8 border-4 border-emerald-500 border-t-transparent mb-2"></div>
                <p class="text-xs text-emerald-400" id="loading-text">Extrayendo y ejecutando juego...</p>
            </div>
            <iframe id="game-frame" class="w-full h-full border-none absolute inset-0 hidden" allowfullscreen="true" webkitallowfullscreen="true" mozallowfullscreen="true"></iframe>
        </div>
    </div>

    <!-- LÓGICA JAVASCRIPT BLINDADA -->
    <script>
        const firebaseConfig = { projectId: "snowproductions" };
        if (!firebase.apps.length) {
            firebase.initializeApp(firebaseConfig);
        }
        const db = firebase.firestore();

        const ADMIN_USER = "ZenHan";
        const ADMIN_PASS = "Vikingo9012";

        let currentObjectUrl = null;

        function handleLogin() {
            const uInput = document.getElementById("username");
            const pInput = document.getElementById("password");
            const loginError = document.getElementById("login-error");
            const loginBtn = document.getElementById("login-btn");

            const u = uInput ? uInput.value.trim() : "";
            const p = pInput ? pInput.value.trim() : "";
            
            if (loginError) loginError.classList.add("hidden");

            if (!u || !p) {
                if (loginError) {
                    loginError.textContent = "Completa todos los campos.";
                    loginError.classList.remove("hidden");
                }
                return;
            }

            if (u === ADMIN_USER && p === ADMIN_PASS) {
                localStorage.setItem("session_role", "admin");
                localStorage.setItem("session_user", ADMIN_USER);
                showPanel("admin");
                loadAdminData();
                return;
            }

            if (loginBtn) {
                loginBtn.textContent = "Verificando...";
                loginBtn.disabled = true;
            }

            db.collection("guests").get().then((snap) => {
                let match = false;
                snap.forEach(doc => {
                    const data = doc.data();
                    if (data.username === u && data.password === p) {
                        match = true;
                    }
                });

                if (match) {
                    localStorage.setItem("session_role", "guest");
                    localStorage.setItem("session_user", u);
                    showPanel("guest");
                    loadGuestGames();
                } else {
                    if (loginError) {
                        loginError.textContent = "Usuario o contraseña incorrectos.";
                        loginError.classList.remove("hidden");
                    }
                }
            }).catch((err) => {
                if (loginError) {
                    loginError.textContent = "Error al conectar con la base de datos.";
                    loginError.classList.remove("hidden");
                }
            }).finally(() => {
                if (loginBtn) {
                    loginBtn.textContent = "INICIAR SESIÓN 🚀";
                    loginBtn.disabled = false;
                }
            });
        }

        function showPanel(role) {
            const loginScreen = document.getElementById("login-screen");
            const adminPanel = document.getElementById("admin-panel");
            const guestPanel = document.getElementById("guest-panel");

            if (loginScreen) loginScreen.classList.add("hidden");
            if (adminPanel) adminPanel.classList.add("hidden");
            if (guestPanel) guestPanel.classList.add("hidden");

            if (role === "admin" && adminPanel) adminPanel.classList.remove("hidden");
            if (role === "guest" && guestPanel) {
                guestPanel.classList.remove("hidden");
                const guestWelcome = document.getElementById("guest-welcome");
                if (guestWelcome) {
                    guestWelcome.textContent = `Conectado como: ${localStorage.getItem("session_user")}`;
                }
            }
        }

        function logout() {
            localStorage.clear();
            const adminPanel = document.getElementById("admin-panel");
            const guestPanel = document.getElementById("guest-panel");
            const loginScreen = document.getElementById("login-screen");
            const uInput = document.getElementById("username");
            const pInput = document.getElementById("password");

            if (adminPanel) adminPanel.classList.add("hidden");
            if (guestPanel) guestPanel.classList.add("hidden");
            if (loginScreen) loginScreen.classList.remove("hidden");
            if (uInput) uInput.value = "";
            if (pInput) pInput.value = "";
        }

        function uploadGame() {
            const nameInput = document.getElementById("game-name");
            const fileInput = document.getElementById("game-file");
            const uploadGameBtn = document.getElementById("upload-game-btn");

            const name = nameInput ? nameInput.value.trim() : "";
            const file = fileInput && fileInput.files ? fileInput.files[0] : null;

            if (!name || !file) {
                alert("Escribe el nombre y selecciona un archivo ZIP.");
                return;
            }

            if (uploadGameBtn) {
                uploadGameBtn.textContent = "Guardando en la nube...";
                uploadGameBtn.disabled = true;
            }

            const reader = new FileReader();
            reader.onload = function(event) {
                const base64Zip = event.target.result;
                
                db.collection("games").add({
                    name: name,
                    zipData: base64Zip,
                    createdAt: firebase.firestore.FieldValue.serverTimestamp()
                }).then(() => {
                    alert("¡Juego subido y publicado con éxito!");
                    if (nameInput) nameInput.value = "";
                    if (fileInput) fileInput.value = "";
                    loadAdminData();
                }).catch(() => {
                    alert("Error al guardar el juego.");
                }).finally(() => {
                    if (uploadGameBtn) {
                        uploadGameBtn.textContent = "Subir y Publicar Juego";
                        uploadGameBtn.disabled = false;
                    }
                });
            };
            reader.readAsDataURL(file);
        }

        function createGuest() {
            const userInput = document.getElementById("guest-user");
            const passInput = document.getElementById("guest-pass");

            const username = userInput ? userInput.value.trim() : "";
            const password = passInput ? passInput.value.trim() : "";

            if (!username || !password) {
                alert("Completa los datos del invitado.");
                return;
            }

            db.collection("guests").add({ username, password }).then(() => {
                alert("¡Cuenta de invitado creada!");
                if (userInput) userInput.value = "";
                if (passInput) passInput.value = "";
                loadAdminData();
            }).catch(() => {
                alert("Error al crear la cuenta.");
            });
        }

        function loadAdminData() {
            const adminGamesList = document.getElementById("admin-games-list");
            const adminUsersList = document.getElementById("admin-users-list");

            if (adminGamesList) {
                adminGamesList.innerHTML = "";
                db.collection("games").get().then((snap) => {
                    snap.forEach(doc => {
                        const data = doc.data();
                        const div = document.createElement("div");
                        div.className = "flex justify-between items-center bg-emerald-950/60 p-2.5 rounded-lg text-xs border border-emerald-800/40";
                        div.innerHTML = `<span class="truncate max-w-[200px] font-medium text-emerald-200">${data.name}</span>
                            <button type="button" onclick="deleteGame('${doc.id}')" class="bg-rose-500/20 text-rose-300 hover:bg-rose-500/40 px-2.5 py-1 rounded font-semibold cursor-pointer">Borrar</button>`;
                        adminGamesList.appendChild(div);
                    });
                });
            }

            if (adminUsersList) {
                adminUsersList.innerHTML = "";
                db.collection("guests").get().then((snap) => {
                    snap.forEach(doc => {
                        const data = doc.data();
                        const div = document.createElement("div");
                        div.className = "flex justify-between items-center bg-emerald-950/60 p-2.5 rounded-lg text-xs border border-emerald-800/40";
                        div.innerHTML = `<span class="truncate max-w-[200px] font-medium text-emerald-200">${data.username}</span>
                            <button type="button" onclick="deleteUser('${doc.id}')" class="bg-rose-500/20 text-rose-300 hover:bg-rose-500/40 px-2.5 py-1 rounded font-semibold cursor-pointer">Borrar</button>`;
                        adminUsersList.appendChild(div);
                    });
                });
            }
        }

        function deleteGame(id) {
            if (confirm("¿Deseas eliminar este juego?")) {
                db.collection("games").doc(id).delete().then(() => loadAdminData());
            }
        }

        function deleteUser(id) {
            if (confirm("¿Deseas eliminar este usuario?")) {
                db.collection("guests").doc(id).delete().then(() => loadAdminData());
            }
        }

        function loadGuestGames() {
            const gamesList = document.getElementById("games-list");
            if (!gamesList) return;

            gamesList.innerHTML = "";
            db.collection("games").get().then((snap) => {
                snap.forEach(doc => {
                    const data = doc.data();
                    const btn = document.createElement("button");
                    btn.type = "button";
                    btn.className = "w-full text-left bg-emerald-950/60 hover:bg-emerald-900/60 border border-emerald-800/50 p-3 rounded-xl transition flex justify-between items-center cursor-pointer";
                    btn.innerHTML = `<span class="font-semibold text-sm text-emerald-200">${data.name}</span><span class="text-xs bg-emerald-500 text-slate-950 font-bold px-2.5 py-1 rounded-lg">Jugar 🚀</span>`;
                    btn.onclick = () => launchGame(data.zipData, data.name);
                    gamesList.appendChild(btn);
                });
            });
        }

        function launchGame(zipData, name) {
            const emulatorTitle = document.getElementById("emulator-title");
            const emulatorScreen = document.getElementById("emulator-screen");
            const emulatorLoading = document.getElementById("emulator-loading");
            const loadingText = document.getElementById("loading-text");
            const gameFrame = document.getElementById("game-frame");
            const downloadZipBtn = document.getElementById("download-zip-btn");

            if (emulatorTitle) emulatorTitle.textContent = name;
            if (emulatorScreen) emulatorScreen.classList.remove("hidden");
            if (emulatorLoading) emulatorLoading.classList.remove("hidden");
            if (gameFrame) gameFrame.classList.add("hidden");
            if (downloadZipBtn) downloadZipBtn.classList.add("hidden");

            if (currentObjectUrl) URL.revokeObjectURL(currentObjectUrl);

            try {
                if (loadingText) loadingText.textContent = "Procesando paquete...";
                
                const base64WithoutPrefix = zipData.split(',')[1] || zipData;
                const binaryString = atob(base64WithoutPrefix);
                const bytes = new Uint8Array(binaryString.length);
                for (let i = 0; i < binaryString.length; i++) {
                    bytes[i] = binaryString.charCodeAt(i);
                }
                const blob = new Blob([bytes], { type: "application/zip" });

                if (loadingText) loadingText.textContent = "Descomprimiendo archivos...";
                const zip = new JSZip();
                
                zip.loadAsync(blob).then(async (zipContent) => {
                    let indexFile = null;
                    let filesMap = {};

                    for (let filename of Object.keys(zipContent.files)) {
                        const zipEntry = zipContent.files[filename];
                        if (!zipEntry.dir) {
                            const fileBlob = await zipEntry.async("blob");
                            const fileUrl = URL.createObjectURL(fileBlob);
                            filesMap[filename] = fileUrl;
                            filesMap['/' + filename] = fileUrl;
                            if (filename.toLowerCase().endsWith("index.html") && !indexFile) {
                                indexFile = fileUrl;
                            }
                        }
                    }

                    if (!indexFile) throw new Error("No se encontró index.html dentro del archivo ZIP.");

                    const htmlResponse = await fetch(indexFile);
                    let htmlText = await htmlResponse.text();

                    for (let path in filesMap) {
                        if (path !== 'index.html' && path !== '/index.html') {
                            const cleanPath = path.startsWith('/') ? path.slice(1) : path;
                            htmlText = htmlText.replaceAll(`"${cleanPath}"`, `"${filesMap[path]}"`);
                            htmlText = htmlText.replaceAll(`'${cleanPath}'`, `'${filesMap[path]}'`);
                            htmlText = htmlText.replaceAll(`="${cleanPath}"`, `="${filesMap[path]}"`);
                        }
                    }

                    const finalBlob = new Blob([htmlText], { type: "text/html" });
                    currentObjectUrl = URL.createObjectURL(finalBlob);

                    if (gameFrame) {
                        gameFrame.src = currentObjectUrl;
                    }
                    if (emulatorLoading) emulatorLoading.classList.add("hidden");
                    if (gameFrame) gameFrame.classList.remove("hidden");

                    if (downloadZipBtn) {
                        downloadZipBtn.onclick = () => {
                            const a = document.createElement('a');
                            a.href = URL.createObjectURL(blob);
                            a.download = name.toLowerCase().replace(/\s+/g, '-') + '.zip';
                            a.click();
                        };
                        downloadZipBtn.classList.remove("hidden");
                    }
                }).catch((err) => {
                    if (emulatorLoading) {
                        emulatorLoading.innerHTML = `<p class="text-rose-400 text-sm">Error al descomprimir: ${err.message}</p>`;
                    }
                });

            } catch (err) {
                if (emulatorLoading) {
                    emulatorLoading.innerHTML = `<p class="text-rose-400 text-sm">Error al procesar: ${err.message}</p>`;
                }
            }
        }

        function toggleFullscreen() {
            const emulatorScreen = document.getElementById("emulator-screen");
            if (!emulatorScreen) return;

            if (!document.fullscreenElement) {
                emulatorScreen.requestFullscreen().catch(err => {
                    alert("No se pudo activar pantalla completa.");
                });
            } else {
                document.exitFullscreen();
            }
        }

        function closeEmulator() {
            if (document.fullscreenElement) {
                document.exitFullscreen().catch(() => {});
            }
            const emulatorScreen = document.getElementById("emulator-screen");
            const gameFrame = document.getElementById("game-frame");

            if (emulatorScreen) emulatorScreen.classList.add("hidden");
            if (gameFrame) gameFrame.src = "";
            if (currentObjectUrl) {
                URL.revokeObjectURL(currentObjectUrl);
                currentObjectUrl = null;
            }
        }

        window.onload = function() {
            const role = localStorage.getItem("session_role");
            if (role === "admin") {
                showPanel("admin");
                loadAdminData();
            } else if (role === "guest") {
                showPanel("guest");
                loadGuestGames();
            }
        };
    </script>
</body>
</html>
