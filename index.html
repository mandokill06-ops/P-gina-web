<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Plataforma de Juegos HTML5</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- JSZip -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
    <!-- Firebase App y Firestore (SDK Compat) -->
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
    <style>
        body { background-color: #0f172a; color: #f8fafc; font-family: system-ui, -apple-system, sans-serif; }
    </style>
</head>
<body class="min-h-screen flex flex-col items-center justify-center p-4">

    <!-- CONTENEDOR PRINCIPAL -->
    <div id="app" class="w-full max-w-md bg-slate-900 border border-slate-800 rounded-2xl shadow-2xl p-6">
        
        <!-- PANTALLA DE LOGIN -->
        <div id="login-screen">
            <div class="text-center mb-6">
                <span class="text-4xl">🎮</span>
                <h1 class="text-2xl font-bold mt-2">Zona Privada</h1>
                <p class="text-slate-400 text-sm">Plataforma de Juegos HTML5</p>
            </div>
            
            <form id="login-form" class="space-y-4">
                <div>
                    <label class="block text-xs font-semibold text-slate-400 mb-1">USUARIO</label>
                    <input type="text" id="username" required class="w-full bg-slate-800 border border-slate-700 rounded-xl px-4 py-3 text-white focus:outline-none focus:border-indigo-500" placeholder="Tu usuario">
                </div>
                <div>
                    <label class="block text-xs font-semibold text-slate-400 mb-1">CONTRASEÑA</label>
                    <input type="password" id="password" required class="w-full bg-slate-800 border border-slate-700 rounded-xl px-4 py-3 text-white focus:outline-none focus:border-indigo-500" placeholder="••••••••">
                </div>
                <button type="submit" id="login-btn" class="w-full bg-indigo-600 hover:bg-indigo-500 font-semibold py-3 rounded-xl transition duration-200">
                    Iniciar Sesión
                </button>
            </form>
            <p id="login-error" class="text-red-400 text-xs text-center mt-3 hidden"></p>
        </div>

        <!-- PANEL DE ADMINISTRADOR -->
        <div id="admin-panel" class="hidden space-y-6">
            <div class="flex justify-between items-center border-b border-slate-800 pb-4">
                <div>
                    <h1 class="text-xl font-bold flex items-center gap-2">👑 Panel Admin</h1>
                    <p class="text-xs text-slate-400">Bienvenido, Eleot Herrera</p>
                </div>
                <button onclick="logout()" class="bg-red-500/10 text-red-400 hover:bg-red-500/20 px-3 py-1.5 rounded-lg text-xs font-semibold transition">Salir</button>
            </div>

            <!-- Subir Juego Local (.ZIP) -->
            <div class="bg-slate-800/50 border border-slate-800 p-4 rounded-xl space-y-3">
                <h2 class="text-sm font-bold text-indigo-400">Subir Juego Local (.ZIP)</h2>
                <form id="game-form" class="space-y-3">
                    <input type="text" id="game-name" required placeholder="Nombre del Juego / Versión" class="w-full bg-slate-800 border border-slate-700 rounded-lg px-3 py-2 text-sm text-white">
                    <div>
                        <label class="block text-xs text-slate-400 mb-1">Seleccionar .ZIP de tu dispositivo:</label>
                        <input type="file" id="game-file" accept=".zip" required class="w-full bg-slate-800 border border-slate-700 rounded-lg px-3 py-2 text-xs text-slate-300 file:mr-4 file:py-1 file:px-3 file:rounded-md file:border-0 file:text-xs file:font-semibold file:bg-indigo-600 file:text-white hover:file:bg-indigo-500">
                    </div>
                    <button type="submit" id="upload-game-btn" class="w-full bg-indigo-600 hover:bg-indigo-500 text-sm font-semibold py-2 rounded-lg transition">
                        Subir y Publicar Juego
                    </button>
                </form>
            </div>

            <!-- Lista de Juegos Registrados -->
            <div class="space-y-2">
                <h3 class="text-xs font-bold text-slate-400 uppercase tracking-wider">Juegos Registrados</h3>
                <div id="admin-games-list" class="space-y-2 max-h-40 overflow-y-auto pr-1"></div>
            </div>

            <!-- Crear Cuenta Invitado -->
            <div class="bg-slate-800/50 border border-slate-800 p-4 rounded-xl space-y-3">
                <h2 class="text-sm font-bold text-emerald-400">Crear Cuenta de Invitado</h2>
                <form id="guest-form" class="space-y-3">
                    <input type="text" id="guest-user" required placeholder="Usuario Invitado" class="w-full bg-slate-800 border border-slate-700 rounded-lg px-3 py-2 text-sm text-white">
                    <input type="password" id="guest-pass" required placeholder="Contraseña de Invitado" class="w-full bg-slate-800 border border-slate-700 rounded-lg px-3 py-2 text-sm text-white">
                    <button type="submit" class="w-full bg-emerald-600 hover:bg-emerald-500 text-sm font-semibold py-2 rounded-lg transition">Crear Cuenta</button>
                </form>
            </div>

            <!-- Lista de Usuarios Invitados -->
            <div class="space-y-2">
                <h3 class="text-xs font-bold text-slate-400 uppercase tracking-wider">Usuarios Invitados</h3>
                <div id="admin-users-list" class="space-y-2 max-h-40 overflow-y-auto pr-1"></div>
            </div>
        </div>

        <!-- PANEL DE INVITADO / JUEGOS -->
        <div id="guest-panel" class="hidden space-y-4">
            <div class="flex justify-between items-center border-b border-slate-800 pb-4">
                <div>
                    <h1 class="text-xl font-bold">🎮 Zona de Juegos</h1>
                    <p id="guest-welcome" class="text-xs text-slate-400"></p>
                </div>
                <button onclick="logout()" class="bg-red-500/10 text-red-400 hover:bg-red-500/20 px-3 py-1.5 rounded-lg text-xs font-semibold transition">Salir</button>
            </div>

            <div class="space-y-2">
                <h2 class="text-xs font-bold text-slate-400 uppercase tracking-wider">Juegos Disponibles</h2>
                <div id="games-list" class="space-y-2 max-h-96 overflow-y-auto"></div>
            </div>
        </div>

        <!-- REPRODUCTOR DE JUEGO INTEGRADO -->
        <div id="emulator-screen" class="hidden fixed inset-0 bg-black z-50 flex flex-col">
            <div class="bg-slate-900 border-b border-slate-800 p-3 flex justify-between items-center">
                <span id="emulator-title" class="font-bold text-sm">Cargando juego...</span>
                <div class="flex gap-2">
                    <button id="download-zip-btn" class="bg-emerald-600 hover:bg-emerald-500 text-white px-3 py-1.5 rounded-lg text-xs font-semibold hidden">Descargar ZIP</button>
                    <button onclick="closeEmulator()" class="bg-red-600 hover:bg-red-500 text-white px-3 py-1.5 rounded-lg text-xs font-semibold">X Cerrar</button>
                </div>
            </div>
            <div id="emulator-content" class="flex-1 relative flex items-center justify-center">
                <div id="emulator-loading" class="text-center">
                    <div class="inline-block animate-spin rounded-full h-8 w-8 border-4 border-indigo-500 border-t-transparent mb-2"></div>
                    <p class="text-xs text-slate-400" id="loading-text">Extrayendo y ejecutando juego...</p>
                </div>
                <iframe id="game-frame" class="w-full h-full border-none hidden"></iframe>
            </div>
        </div>

    </div>

    <!-- LÓGICA JAVASCRIPT CON FIREBASE -->
    <script>
        // 1. Inicialización de Firebase
        const firebaseConfig = { projectId: "snowproductions" };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();

        // Credenciales Admin
        const ADMIN_USER = "Eleot Herrera";
        const ADMIN_PASS = "EleotyMando777";

        // Referencias del DOM
        const loginScreen = document.getElementById("login-screen");
        const adminPanel = document.getElementById("admin-panel");
        const guestPanel = document.getElementById("guest-panel");
        const loginForm = document.getElementById("login-form");
        const loginError = document.getElementById("login-error");
        const loginBtn = document.getElementById("login-btn");
        const gamesList = document.getElementById("games-list");
        const adminGamesList = document.getElementById("admin-games-list");
        const adminUsersList = document.getElementById("admin-users-list");
        const emulatorScreen = document.getElementById("emulator-screen");
        const gameFrame = document.getElementById("game-frame");
        const emulatorTitle = document.getElementById("emulator-title");
        const emulatorLoading = document.getElementById("emulator-loading");
        const loadingText = document.getElementById("loading-text");
        const downloadZipBtn = document.getElementById("download-zip-btn");
        const uploadGameBtn = document.getElementById("upload-game-btn");

        let currentObjectUrl = null;

        // 2. Control de Inicio de Sesión
        loginForm.addEventListener("submit", function (e) {
            e.preventDefault();
            const u = document.getElementById("username").value.trim();
            const p = document.getElementById("password").value.trim();
            
            loginError.classList.add("hidden");

            // A. Admin (Validación Local Inmediata)
            if (u === ADMIN_USER && p === ADMIN_PASS) {
                localStorage.setItem("session_role", "admin");
                localStorage.setItem("session_user", ADMIN_USER);
                showPanel("admin");
                loadAdminData();
                return;
            }

            // B. Invitados (Validación Firestore)
            loginBtn.textContent = "Verificando...";
            loginBtn.disabled = true;

            db.collection("guests").get().then((snap) => {
                let match = false;
                snap.forEach(doc => {
                    const data = doc.data();
                    if (data.username === u && data.password === p) {
                        match = true;
                    }
                });

                if (match) {
                    localStorage.setItem("session_role", "guest");
                    localStorage.setItem("session_user", u);
                    showPanel("guest");
                    loadGuestGames();
                } else {
                    loginError.textContent = "Usuario o contraseña incorrectos.";
                    loginError.classList.remove("hidden");
                }
            }).catch((err) => {
                loginError.textContent = "Error al conectar con la base de datos.";
                loginError.classList.remove("hidden");
            }).finally(() => {
                loginBtn.textContent = "Iniciar Sesión";
                loginBtn.disabled = false;
            });
        });

        function showPanel(role) {
            loginScreen.classList.add("hidden");
            adminPanel.classList.add("hidden");
            guestPanel.classList.add("hidden");

            if (role === "admin") adminPanel.classList.remove("hidden");
            if (role === "guest") {
                guestPanel.classList.remove("hidden");
                document.getElementById("guest-welcome").textContent = `Conectado como: ${localStorage.getItem("session_user")}`;
            }
        }

        function logout() {
            localStorage.clear();
            adminPanel.classList.add("hidden");
            guestPanel.classList.add("hidden");
            loginScreen.classList.remove("hidden");
            loginForm.reset();
        }

        // 3. Subir Juego Local (.ZIP en Base64 a Firestore)
        document.getElementById("game-form").addEventListener("submit", function (e) {
            e.preventDefault();
            const name = document.getElementById("game-name").value.trim();
            const fileInput = document.getElementById("game-file");
            const file = fileInput.files[0];

            if (!file) {
                alert("Por favor selecciona un archivo ZIP.");
                return;
            }

            uploadGameBtn.textContent = "Guardando en la nube...";
            uploadGameBtn.disabled = true;

            const reader = new FileReader();
            reader.onload = function(event) {
                const base64Zip = event.target.result;
                
                db.collection("games").add({
                    name: name,
                    zipData: base64Zip,
                    createdAt: firebase.firestore.FieldValue.serverTimestamp()
                }).then(() => {
                    alert("¡Juego subido y publicado con éxito!");
                    document.getElementById("game-form").reset();
                    loadAdminData();
                }).catch((err) => {
                    alert("Error al guardar el juego. Asegúrate de que el archivo no sea demasiado pesado.");
                }).finally(() => {
                    uploadGameBtn.textContent = "Subir y Publicar Juego";
                    uploadGameBtn.disabled = false;
                });
            };
            reader.readAsDataURL(file);
        });

        // 4. Crear Invitado
        document.getElementById("guest-form").addEventListener("submit", function (e) {
            e.preventDefault();
            const username = document.getElementById("guest-user").value.trim();
            const password = document.getElementById("guest-pass").value.trim();

            db.collection("guests").add({ username, password }).then(() => {
                alert("¡Cuenta de invitado creada!");
                document.getElementById("guest-form").reset();
                loadAdminData();
            }).catch(() => {
                alert("Error al crear la cuenta.");
            });
        });

        // 5. Cargar Datos del Admin
        function loadAdminData() {
            // Cargar Juegos
            adminGamesList.innerHTML = "";
            db.collection("games").get().then((snap) => {
                snap.forEach(doc => {
                    const data = doc.data();
                    const div = document.createElement("div");
                    div.className = "flex justify-between items-center bg-slate-800 p-2.5 rounded-lg text-xs";
                    div.innerHTML = `<span class="truncate max-w-[200px] font-medium">${data.name}</span>
                        <button onclick="deleteGame('${doc.id}')" class="bg-red-500/20 text-red-400 hover:bg-red-500/40 px-2.5 py-1 rounded font-semibold">Borrar</button>`;
                    adminGamesList.appendChild(div);
                });
            });

            // Cargar Usuarios
            adminUsersList.innerHTML = "";
            db.collection("guests").get().then((snap) => {
                snap.forEach(doc => {
                    const data = doc.data();
                    const div = document.createElement("div");
                    div.className = "flex justify-between items-center bg-slate-800 p-2.5 rounded-lg text-xs";
                    div.innerHTML = `<span class="truncate max-w-[200px] font-medium">${data.username}</span>
                        <button onclick="deleteUser('${doc.id}')" class="bg-red-500/20 text-red-400 hover:bg-red-500/40 px-2.5 py-1 rounded font-semibold">Borrar</button>`;
                    adminUsersList.appendChild(div);
                });
            });
        }

        function deleteGame(id) {
            if (confirm("¿Deseas eliminar este juego?")) {
                db.collection("games").doc(id).delete().then(() => loadAdminData());
            }
        }

        function deleteUser(id) {
            if (confirm("¿Deseas eliminar este usuario?")) {
                db.collection("guests").doc(id).delete().then(() => loadAdminData());
            }
        }

        // 6. Cargar Juegos para Invitados
        function loadGuestGames() {
            gamesList.innerHTML = "";
            db.collection("games").get().then((snap) => {
                snap.forEach(doc => {
                    const data = doc.data();
                    const btn = document.createElement("button");
                    btn.className = "w-full text-left bg-slate-800 hover:bg-slate-700/80 p-3 rounded-xl transition flex justify-between items-center";
                    btn.innerHTML = `<span class="font-semibold text-sm">${data.name}</span><span class="text-xs bg-indigo-600 px-2.5 py-1 rounded-lg">Jugar 🚀</span>`;
                    btn.onclick = () => launchGame(data.zipData, data.name);
                    gamesList.appendChild(btn);
                });
            });
        }

        // 7. Descomprimir y Ejecutar el Juego ZIP
        function launchGame(zipData, name) {
            emulatorTitle.textContent = name;
            emulatorScreen.classList.remove("hidden");
            emulatorLoading.classList.remove("hidden");
            gameFrame.classList.add("hidden");
            downloadZipBtn.classList.add("hidden");

            if (currentObjectUrl) URL.revokeObjectURL(currentObjectUrl);

            try {
                loadingText.textContent = "Procesando paquete...";
                
                const base64WithoutPrefix = zipData.split(',')[1] || zipData;
                const binaryString = atob(base64WithoutPrefix);
                const bytes = new Uint8Array(binaryString.length);
                for (let i = 0; i < binaryString.length; i++) {
                    bytes[i] = binaryString.charCodeAt(i);
                }
                const blob = new Blob([bytes], { type: "application/zip" });

                loadingText.textContent = "Descomprimiendo archivos...";
                const zip = new JSZip();
                
                zip.loadAsync(blob).then(async (zipContent) => {
                    let indexFile = null;
                    let filesMap = {};

                    for (let filename of Object.keys(zipContent.files)) {
                        const zipEntry = zipContent.files[filename];
                        if (!zipEntry.dir) {
                            const fileBlob = await zipEntry.async("blob");
                            const fileUrl = URL.createObjectURL(fileBlob);
                            filesMap[filename] = fileUrl;
                            filesMap['/' + filename] = file
